services:
  frontend:
    build:
      context: ./frontend
      target: builder
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - docstore:/data/documents
      - ./extension:/extension:ro
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DOCUMENT_STORAGE_DIR: /data/documents
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  temporal-worker:
    build: ./backend
    command: python -m app.temporal_worker
    env_file: .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DOCUMENT_STORAGE_DIR: /data/documents
      # Agents run here, not in the API container, so localhost:8000 (the
      # default) is not the gateway; reach it by service name.
      LLM_GATEWAY_URL: http://backend:8000/llm-gateway/v1
    volumes:
      - ./backend/app:/app/app
      - docstore:/data/documents
    init: true
    stop_grace_period: 360s
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  notification-worker:
    build: ./backend
    command: python -m app.notification_worker
    env_file: .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./backend/app:/app/app
    init: true
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  # Single-container Temporal dev server (in-memory; history is lost on
  # restart). Web UI on http://localhost:8233.
  temporal:
    image: temporalio/temporal:1.5.1
    command: server start-dev --ip 0.0.0.0
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  docstore:
