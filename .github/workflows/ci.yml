name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  # Protected live-smoke entry point (see the live-smoke job below): only a
  # manual trigger runs it, never a push or pull_request, since it needs live
  # deployed-environment secrets and may exercise a real account.
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.lock ruff black bandit pytest-cov
      - name: Install Chromium for adapter tests
        run: python -m playwright install --with-deps chromium

      - name: Lock file matches requirements
        run: |
          pip install uv
          cp requirements.lock /tmp/requirements.lock
          uv pip compile requirements.txt -c constraints.txt --universal --python-version 3.12 \
            -o /tmp/requirements.lock --no-header --quiet
          diff -u requirements.lock /tmp/requirements.lock || {
            echo "requirements.lock is stale: rerun the uv pip compile command above in backend/" >&2
            exit 1
          }

      - name: Dependency audit
        run: |
          pip install --upgrade pip pip-audit
          pip-audit --skip-editable

      - name: Relay dependency audit
        run: pip-audit -r ../deploy/computers/relay-requirements.lock --no-deps --disable-pip

      - name: Lint (ruff)
        run: ruff check . --exit-zero
      - name: Reject new Ruff diagnostics
        run: python ../scripts/check_changed_python_lint.py
        env:
          CI_LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Format check (black)
        run: python ../scripts/check_changed_python_format.py

      - name: Security scan (bandit)
        run: bandit -r app/ -ll -x tests/

      - name: Unit tests
        run: pytest tests/unit tests/security -v --cov=app --cov-report=term-missing
        env:
          APP_SECRET_KEY: "test-secret-key-32-chars-minimum!!"
          DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x"
          REDIS_URL: "redis://localhost:6379"

  backend-workflow-integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - run: pip install -r requirements.lock
        working-directory: backend

      - name: Start disposable Postgres/Redis containers
        run: docker compose -p careercraft-workflow-tests -f docker-compose.test.yml up -d postgres redis

      - name: Wait for Postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker exec careercraft-workflow-tests-postgres-1 pg_isready -U workflow_test; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Migrate disposable applications database
        run: |
          docker exec careercraft-workflow-tests-postgres-1 psql -U workflow_test -c 'CREATE DATABASE applications_test'
          python scripts/migrate.py --database-url postgresql://workflow_test:workflow_test@127.0.0.1:55439/applications_test --bootstrap

      - name: Durable workflow integration tests
        working-directory: backend
        run: python -m pytest tests/integration/test_durable_workflows.py tests/integration/test_inline_run_locking.py tests/integration/test_migration_runner.py tests/integration/test_account_erasure.py tests/integration/test_model_settings_db.py tests/integration/test_inbox_status_tracking.py tests/integration/test_interview_history.py tests/integration/test_agent_memory_api.py tests/integration/test_recruiter_outreach.py tests/integration/test_rule_tailoring.py tests/integration/test_copilot_admission.py tests/integration/test_document_lifecycle.py tests/integration/test_applications_list.py tests/integration/test_audit_remediation.py -v --timeout=90
        env:
          RUN_WORKFLOW_INTEGRATION: "1"
          APPLICATIONS_DB_URL: "postgresql+asyncpg://workflow_test:workflow_test@127.0.0.1:55439/applications_test"

      - name: Tear down disposable containers
        if: always()
        run: docker compose -p careercraft-workflow-tests -f docker-compose.test.yml down

  frontend-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Computer supervisor patch checks
        run: node --test ../deploy/computers/purge-supervisor.test.mjs ../deploy/computers/harden-supervisor.test.mjs

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  extension-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check extension scripts and manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Sender and approval boundary checks
        run: |
          node test/submit_sender.test.mjs
          node test/generic_entry.test.mjs
      - name: Production validation failure checks
        run: bash ../scripts/test_validate_production.sh
      # Real Chromium with the unpacked extension against local fixture job
      # sites and a fake API; no request leaves the runner.
      - name: End-to-end apply flow
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node test/e2e_apply.mjs

  # Cheap, no-credentials-needed guard against e2e test-file syntax/import
  # breakage (missing fixture, bad import, etc.) on every PR. Collection-only
  # never touches RUN_LIVE_E2E paths -- see backend/tests/e2e/conftest.py.
  e2e-collection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - run: pip install -r requirements.lock

      - name: Collect E2E suite (no live credentials required)
        run: pytest tests/e2e --collect-only -q
        env:
          APP_SECRET_KEY: "test-secret-key-32-chars-minimum!!"
          DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x"
          REDIS_URL: "redis://localhost:6379"

  # Protected entry point: only runs on a manual `workflow_dispatch` trigger,
  # never on push/pull_request (see the `on:` block above), because it needs
  # live deployed-environment secrets and drives a real signed-in browser
  # session. RUN_LIVE_E2E / ALLOW_LIVE_SENDS are intentionally never set here
  # beyond what scripts/run_e2e_tests.sh itself sets (RUN_LIVE_E2E=1) --
  # ALLOW_LIVE_SENDS stays unset so no email/outreach/application send can be
  # approved from CI.
  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - run: pip install -r requirements.lock
        working-directory: backend

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
        working-directory: backend

      - name: Run live E2E smoke suite
        run: bash scripts/run_e2e_tests.sh
        env:
          TEST_JWT: ${{ secrets.E2E_TEST_JWT }}
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          WEB_URL: ${{ secrets.E2E_WEB_URL }}
          API_URL: ${{ secrets.E2E_API_URL }}
          TEST_OTP_CODE: ${{ secrets.E2E_TEST_OTP_CODE }}
          HEADLESS: "1"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-smoke-artifacts
          path: |
            backend/tests/e2e/screenshots/
            backend/tests/e2e/videos/
            backend/tests/e2e/traces/
            backend/tests/e2e/outputs/
            backend/tests/e2e/.artifacts/
            backend/tests/e2e/results.log
          if-no-files-found: ignore
          retention-days: 14
