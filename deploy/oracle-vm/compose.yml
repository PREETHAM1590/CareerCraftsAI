# Oracle Cloud "always free" VM deployment. network_mode: host throughout
# because the VM has no IPv6 route and Supabase's direct DB host + Storage are
# IPv6-only there, so this self-hosts Postgres and local-disk document storage
# instead (see the per-service comments below). Not the topology the root
# docker-compose.yml documents/scripts assume -- see the comment at the top of
# that file for the normal multi-VM/local Docker Compose stack.
#
# Compose v2 resolves the default .env file relative to THIS file's directory
# (deploy/oracle-vm/), not the CWD you run `docker compose` from -- confirmed via
# `docker compose config` silently defaulting every var to blank despite a
# correct .env sitting at the repo root. Keep a real .env here (gitignored,
# NEXT_PUBLIC_API_URL / NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY / CLERK_SECRET_KEY),
# or pass `--env-file <path>` explicitly on every invocation.
name: careercraft-isolated
services:
  backend:
    build: ../../backend
    network_mode: host
    env_file: /opt/careercraft-secrets/backend.env
    # Two worker processes: one Python process can only use one core. The
    # rate limiter, SSE bus, run admission and Temporal all live in
    # Redis/Postgres, so workers share state; caches are per-process.
    command: uvicorn app.main:app --host 127.0.0.1 --port 18100 --workers 2
    init: true
    # Uploaded resumes/documents. Supabase Storage is unreachable from this VM
    # for the same reason the database was, so files live on local disk.
    # Shared with temporal-worker, which reads documents during agent runs.
    volumes:
      - docstore:/data/documents
      # Served as a zip by GET /api/v1/extension/download.
      - ../../extension:/extension:ro
    mem_limit: 1500m
    # Ceiling, not a reservation. 0.5 capped the API at ~200 req/s in the
    # 2026-10-20 k6 test (tests/load/k6_capacity.js).
    cpus: 1.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
  # Executes every workflow (agent runs, job search, applications,
  # follow-ups) and registers the recurring Schedules. TEMPORAL_ADDRESS in
  # backend.env points at the Temporal server (temporal-compose.yml, same VM,
  # TEMPORAL_ADDRESS=127.0.0.1:7233).
  # Not profile-gated: without it nothing the API starts ever runs.
  temporal-worker:
    build: ../../backend
    network_mode: host
    env_file: /opt/careercraft-secrets/backend.env
    command: python -m app.temporal_worker
    # Agents reach their model through the backend's gateway (host network).
    environment:
      LLM_GATEWAY_URL: http://127.0.0.1:18100/llm-gateway/v1
    init: true
    volumes:
      - docstore:/data/documents
    mem_limit: 2g
    cpus: 0.75
    stop_grace_period: 360s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  # Executes NotificationWorkflow (in-app notifications + Resend email) on its
  # own task queues so a notification backlog can't starve temporal-worker.
  # Shares this box, so backend.env's loopback DATABASE_URL / REDIS_URL /
  # TEMPORAL_ADDRESS are correct as-is. Needs RESEND_API_KEY in backend.env
  # for email; without it in-app notifications still work and emails are skipped.
  notification-worker:
    build: ../../backend
    network_mode: host
    env_file: /opt/careercraft-secrets/backend.env
    command: python -m app.notification_worker
    init: true
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        # Next.js inlines NEXT_PUBLIC_* at build time, so the publishable key
        # has to be an ARG as well as runtime env or the client bundle ships
        # without it and Clerk fails to initialise in the browser.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        BACKEND_URL: http://127.0.0.1:18100
    network_mode: host
    environment:
      PORT: 18101
      HOSTNAME: 127.0.0.1
      BACKEND_URL: http://127.0.0.1:18100
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      # Only the Clerk secret is passed, named explicitly. Using
      # env_file: backend.env here injected DATABASE_URL, REDIS_URL and other
      # backend-only credentials into the frontend container — credentials it
      # has no use for and should never hold — and the extra vars broke
      # server-side rendering with a self-proxy to https://localhost:18101.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:18101',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200&&d.length>100?0:1))}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  postgres:
    # Self-hosted database. Supabase's direct host (db.<ref>.supabase.co) is
    # IPv6-only and this VM has no IPv6, so the managed database is simply
    # unreachable from here; the pooler is the only IPv4 path and it rejects
    # the tenant. Running Postgres locally removes that dependency entirely.
    image: pgvector/pgvector:pg16
    network_mode: host
    # listen_addresses is pinned to loopback because network_mode: host means
    # any other value would expose the database on the VM's public interface.
    command: postgres -p 18132 -c listen_addresses=127.0.0.1
    env_file: /opt/careercraft-secrets/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      # pg_isready only needs the server to accept the connection and respond
      # (even with an auth challenge) to report healthy -- it doesn't need a
      # real role, so no POSTGRES_USER (postgres.env, gitignored) is needed here.
      # Without -U, pg_isready runs as OS user root and Postgres logs
      # FATAL: role "root" does not exist on every probe.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 18132 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    network_mode: host
    command: redis-server /etc/redis/careercraft.conf
    volumes:
      - /opt/careercraft-secrets/redis.conf:/etc/redis/careercraft.conf:ro
      - redis_data:/data
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      # redis.conf (gitignored, on the VM) sets `port 18179` and `requirepass
      # <generated>` -- the password isn't available at compose-authoring
      # time, and a plain `ping` would fail (NOAUTH) even when Redis is
      # perfectly healthy, turning this into a false negative. Accepting
      # either PONG or NOAUTH still proves the daemon is up and speaking the
      # Redis protocol without needing the secret in this file.
      test: ["CMD-SHELL", "redis-cli -p 18179 ping | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 5
  gateway:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  redis_data:
  pgdata:
  docstore:
