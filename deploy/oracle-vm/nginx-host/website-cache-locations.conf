# Host nginx, inside the careercraftsai.me 443 server block (replaces its
# `location / { proxy_pass http://127.0.0.1:18101; ... }`). Install as
# /etc/nginx/snippets/website-cache-locations.conf and `include` it there.
# Responses carry `X-Cache: HIT|MISS|EXPIRED|STALE|UPDATING|BYPASS`.
#
# After a frontend deploy, purge so the new build is served at once:
#   sudo find /var/cache/nginx/website -type f -delete

# Next rewrites these to the backend (next.config rewrites). They are dynamic
# and per-visitor (demo quota by IP, the outreach open pixel, health), so they
# are never cached.
location /api/ {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
}

location = /health {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
}

# Content-hashed build assets never change under the same URL.
location /_next/static/ {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    proxy_cache website;
    proxy_cache_key "$host$request_uri|$website_ae";
    # Next sends max-age=1y; cap nginx's own copy at 7 days.
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 7d;
    proxy_no_cache $website_private $http_authorization;
    proxy_cache_bypass $http_authorization;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
}

location / {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    proxy_cache website;
    # Next varies these responses on the RSC/router headers (client-side
    # navigation payloads differ from full HTML), so they are part of the key.
    proxy_cache_key "$host$request_uri|$website_ae|$http_rsc|$http_next_router_state_tree|$http_next_router_prefetch|$http_next_router_segment_prefetch";
    # Next says s-maxage=1y for prerendered pages; cap at 60s so a deploy is
    # live within a minute even without the purge above. Responses Next marks
    # private or no-store, any response that sets a cookie (nginx default),
    # non-200s and requests carrying credentials are never cached.
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 60s;
    proxy_no_cache $website_private $http_authorization;
    proxy_cache_bypass $http_authorization;
    # Keep serving the last good page if Node is restarting or slow.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
}
