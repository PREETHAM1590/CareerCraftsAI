# Host nginx, http level: compress proxied text responses (API JSON etc.).
# Install as /etc/nginx/conf.d/gzip-text.conf. Next.js already compresses its
# own pages and assets, and nginx never re-compresses an encoded response.
# text/event-stream is deliberately absent: gzip would buffer SSE.
#
# Every TLS server block also listens with HTTP/2 (nginx 1.24 syntax):
#   listen 443 ssl http2; # managed by Certbot
# One multiplexed connection per browser instead of up to six TLS handshakes.
gzip_proxied any;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;
