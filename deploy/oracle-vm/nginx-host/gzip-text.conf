# Host nginx, http level: compress proxied text responses (API JSON etc.).
# Install as /etc/nginx/conf.d/gzip-text.conf, then: sudo nginx -t && sudo systemctl reload nginx
#
# This file does NOT turn gzip on: it relies on `gzip on;` already being set in
# the http block of /etc/nginx/nginx.conf (Ubuntu default). Do not add a second
# `gzip on;` here; nginx rejects a duplicate of that directive at the same level.
# Next.js already compresses its own pages and assets, and nginx never
# re-compresses an encoded response.
# text/event-stream is deliberately absent: gzip would buffer SSE.
gzip_proxied any;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

# ---------------------------------------------------------------------------
# MANUAL STEP, not delivered by this file: HTTP/2 (nginx 1.24 syntax).
# The certbot-managed server blocks need `http2` on their TLS listen line, one
# multiplexed connection per browser instead of up to six TLS handshakes.
# Run once on the server:
#
#   sudo sed -i 's/listen 443 ssl; # managed by Certbot/listen 443 ssl http2; # managed by Certbot/' /etc/nginx/sites-available/{api,app,website,temporal,grafana}
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------
