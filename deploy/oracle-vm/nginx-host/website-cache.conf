# Host nginx, http level: response cache for the public marketing site
# (careercraftsai.me). Install as /etc/nginx/conf.d/website-cache.conf; the
# server-block half is website-cache-locations.conf.
#
# The marketing pages are prerendered (Next.js answers them from its own cache
# with `Cache-Control: s-maxage=31536000`), identical for every visitor, and
# there is no Next middleware, so nginx can serve them without waking Node or
# re-compressing them on every request.

proxy_cache_path /var/cache/nginx/website levels=1:2 keys_zone=website:10m
                 max_size=512m inactive=1d use_temp_path=off;

# One cached copy for gzip-capable clients, one for everyone else.
map $http_accept_encoding $website_ae {
    ~*gzip  gzip;
    default identity;
}

# Next marks anything request-specific private/no-store; never store those.
map $upstream_http_cache_control $website_private {
    ~*(private|no-store|no-cache)  1;
    default                        0;
}
