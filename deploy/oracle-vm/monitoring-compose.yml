# Host + container resource monitoring for the APP VM: Prometheus scrapes
# node-exporter (host CPU/RAM/disk/network) and cAdvisor (per-container),
# Grafana shows them. Everything listens on 127.0.0.1 only — open Grafana
# through an SSH tunnel, like the Temporal UI:
#
#   ssh -N -L 19300:127.0.0.1:19300 oraclevm   then http://localhost:19300
#
# Start (from deploy/oracle-vm):
#   sudo docker compose -p monitoring -f monitoring-compose.yml up -d
# Admin password lives in /opt/careercraft-secrets/monitoring.env
# (GF_SECURITY_ADMIN_PASSWORD=...), never in git.
#
# Host networking keeps loopback-only listeners simple and gives node-exporter
# the real host network stats. Memory caps keep monitoring from competing
# with the app on this 2-vCPU box.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=3GB
      - --web.listen-address=127.0.0.1:19090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:19100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    network_mode: host
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --listen_ip=127.0.0.1
      - --port=19080
      - --docker_only=true
      # cAdvisor is CPU-hungry at its defaults; 15s is plenty for dashboards.
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.0
    network_mode: host
    env_file: /opt/careercraft-secrets/monitoring.env
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "19300"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
