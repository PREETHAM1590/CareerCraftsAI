# Host nginx: one JSON line per request with its timing, for Grafana's
# request rate / p50 / p95 / p99 / error panels. Install as
# /etc/nginx/conf.d/timing-log.conf (http-level; the existing access.log is
# unchanged). No client IP and no query string are logged.
log_format timing escape=json
  '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
  '"path":"$uri","status":"$status","rt":$request_time,'
  '"urt":"$upstream_response_time","bytes":$body_bytes_sent,'
  '"ua":"$http_user_agent"}';

access_log /var/log/nginx/timing.log timing;
