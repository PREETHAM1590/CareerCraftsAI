# Alerts, emailed through Resend's SMTP (GF_SMTP_* in monitoring-compose.yml).
# ALERT_EMAIL, GF_SMTP_PASSWORD and GF_SMTP_FROM_ADDRESS come from
# /opt/careercraft-secrets/monitoring.env. Grafana expands $VARS in this file
# and does not unescape $$, so templates use {{ index .Values "B" }} rather
# than $values.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: careercraft-email
    receivers:
      - uid: careercraft-email
        type: email
        settings:
          addresses: $ALERT_EMAIL
          singleEmail: true

policies:
  - orgId: 1
    receiver: careercraft-email
    group_by: [alertname, client]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: computers-security
    folder: CareerCraft
    interval: 1m
    rules:
      # The egress proxy logs only requests it refused (squid.conf). Normal
      # browsing hits none, so a burst from one browser means a page probing the
      # internal network or cloud metadata, or a browser doing something it
      # shouldn't. Chromium's own push channel (mtalk.google.com:5228) is
      # refused 1-4 times per browser per 10 minutes, far under the threshold,
      # so it is counted rather than exempted (a page could abuse an exemption).
      - uid: computers-egress-blocked-spike
        title: "Computers: blocked-request spike"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum by (client) (count_over_time({instance="computers-vm",
                container="careercraft-sandbox-egress-1"} |= "blocked=" | logfmt [5m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [20] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: 'A cloud browser hit {{ index .Values "B" }} blocked requests in 5 minutes'
          description: >-
            Browser {{ index .Labels "client" }} on the computers host (24gb1) was refused
            {{ index .Values "B" }} times by the egress proxy in 5 minutes (private network,
            cloud metadata or a non-web port). Check the egress logs on the
            COMPUTERS dashboard; stop that user's computer if it continues.

  - orgId: 1
    name: core-services
    folder: CareerCraft
    interval: 1m
    rules:
      # cAdvisor stops exporting a container once it is gone, so the 7d
      # max_over_time keeps its last-seen timestamp around long enough to alert
      # on it. A whole VM going dark (Alloy stops pushing) trips every one of its
      # containers at once. sandbox-tunnel is left out until the COMPUTERS server
      # is rebuilt.
      - uid: core-container-down
        title: "Core service down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                time() - max by (instance, name) (max_over_time(container_last_seen{name=~"careercraft-isolated-(backend|frontend|temporal-worker|notification-worker|postgres|redis|gateway)-1|temporal-isolated-temporal(-postgres)?-1|nango-isolated-nango-(server|db|redis)-1|ollama-isolated-ollama-1"}[7d]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [180] }
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ index .Labels "name" }} on {{ index .Labels "instance" }} is down'
          description: >-
            {{ index .Labels "name" }} has not been seen running on {{ index .Labels "instance" }}
            for {{ index .Values "B" }} seconds. If every container on that VM fired together,
            the VM or its Alloy agent is down. Check `docker ps` there.

      # A container stuck in a crash loop stays "seen", so count restarts too.
      # cAdvisor starts a new series on every restart (changes() stays 0), so
      # count the distinct series in the window; a deploy's recreate adds one.
      - uid: core-container-restarting
        title: "Core service restart loop"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                count by (instance, name) (count_over_time(container_start_time_seconds{name=~"careercraft-isolated-(backend|frontend|temporal-worker|notification-worker|postgres|redis|gateway)-1|temporal-isolated-temporal(-postgres)?-1|nango-isolated-nango-(server|db|redis)-1|ollama-isolated-ollama-1"}[15m])) - 1
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: '{{ index .Labels "name" }} on {{ index .Labels "instance" }} restarted {{ index .Values "B" }} times in 15 minutes'
          description: >-
            {{ index .Labels "name" }} keeps restarting. Check `docker logs` for it on
            {{ index .Labels "instance" }}.
