global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:19100"]
        labels:
          instance: app-vm

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:19080"]
        labels:
          instance: app-vm

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:19090"]
