# Host nginx site for Grafana: copy to /etc/nginx/sites-available/grafana,
# link into sites-enabled, then `sudo certbot --nginx -d grafana.careercraftsai.me`
# adds the 443 block and the HTTP->HTTPS redirect (as for temporal.).
server {
    listen 80;
    server_name grafana.careercraftsai.me;

    location / {
        proxy_pass http://127.0.0.1:19300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Grafana Live (streaming panels) uses websockets.
    location /api/live/ {
        proxy_pass http://127.0.0.1:19300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
