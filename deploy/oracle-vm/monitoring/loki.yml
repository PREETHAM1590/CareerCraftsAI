# Single-node Loki on the filesystem; 7 days of container logs.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 19310
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 19311

common:
  path_prefix: /loki
  replication_factor: 1
  instance_addr: 127.0.0.1
  instance_interface_names: [lo]
  ring:
    instance_addr: 127.0.0.1
    instance_interface_names: [lo]
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

# Everything listens on loopback, so the query frontend must advertise
# loopback too, otherwise its own querier dials the VM's private IP and hangs.
frontend:
  address: 127.0.0.1
  instance_interface_names: [lo]

query_scheduler:
  scheduler_ring:
    instance_addr: 127.0.0.1
    instance_interface_names: [lo]

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
