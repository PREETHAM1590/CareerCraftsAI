# Authenticated push endpoints on grafana.careercraftsai.me (TLS) for
# collectors that are not on the APP VM: the INFRA VM's Alloy and k6 load
# tests. Install as /etc/nginx/snippets/monitoring-ingest.conf and include it
# inside the 443 server block of /etc/nginx/sites-enabled/grafana.
# Credentials: /etc/nginx/monitoring-ingest.htpasswd (users: infra, k6).

location = /ingest/prometheus {
    auth_basic "ingest";
    auth_basic_user_file /etc/nginx/monitoring-ingest.htpasswd;
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:19090/api/v1/write;
}

location = /ingest/loki {
    auth_basic "ingest";
    auth_basic_user_file /etc/nginx/monitoring-ingest.htpasswd;
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:19310/loki/api/v1/push;
}
